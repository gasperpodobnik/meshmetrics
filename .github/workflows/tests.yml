name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest:
    name: Latest (Python 3.13, locked dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install system dependencies (VTK)
        run: sudo apt-get update && sudo apt-get install -y libxrender1 libgl1
      - run: uv sync --all-extras --locked --python 3.13
      - run: uv run pytest

  minimum:
    name: Minimum (Python 3.10, VTK 9.2.2, NumPy 1.x)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install system dependencies (VTK)
        run: sudo apt-get update && sudo apt-get install -y libxrender1 libgl1
      - run: uv venv --python 3.10
      - run: uv pip install -e ".[all]" "vtk==9.2.2" "numpy<2" pytest scipy
      - run: .venv/bin/python -m pytest
