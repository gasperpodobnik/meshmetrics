[project]
name = "pymeshmetrics"
version = "1.4.0"
description = "Library to compute distance-based performance metrics for image segmentation tasks."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Gasper Podobnik" },
    { name = "Tomaz Vrtovec" },
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy",
    "SimpleITK",
    "vtk>=9.2",  # oldest VTK with Python 3.10 wheels (9.2.2)
]

[project.optional-dependencies]
trimesh = ["trimesh"]
meshio = ["meshio"]
all = ["trimesh", "meshio"]

[project.urls]
Homepage = "https://github.com/gasperpodobnik/meshmetrics"
Paper = "https://doi.org/10.48550/arXiv.2509.05670"

[dependency-groups]
dev = [
    "pytest",
    "scipy",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meshmetrics"]

[tool.hatch.build.targets.wheel.force-include]
"MeshMetrics.py" = "MeshMetrics.py"  # deprecated import alias

[tool.hatch.build.targets.sdist]
include = ["meshmetrics", "MeshMetrics.py", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
