[project]
name = "pymeshmetrics"
version = "1.0.0"
description = "Library to compute distance-based performance metrics for image segmentation tasks."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Gasper Podobnik" },
    { name = "Tomaz Vrtovec" },
]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "SimpleITK",
    "SimpleITKUtilities",
    "vtk>=9.3",  # vtkSurfaceNets2D/3D
]

[project.optional-dependencies]
trimesh = ["trimesh"]
meshio = ["meshio"]
all = ["trimesh", "meshio"]

[project.urls]
Homepage = "https://github.com/gasperpodobnik/meshmetrics"
Paper = "https://doi.org/10.48550/arXiv.2509.05670"

[dependency-groups]
dev = [
    "pytest",
    "scipy",
    "ipykernel",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meshmetrics"]

[tool.hatch.build.targets.wheel.force-include]
"MeshMetrics.py" = "MeshMetrics.py"  # deprecated import alias

[tool.hatch.build.targets.sdist]
include = ["meshmetrics", "MeshMetrics.py", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # numpy>=2.5 deprecation inside SimpleITKUtilities' vtk2sitk
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]
